name: 텔레그램 카드뉴스 자동 발송 (PC Off 24시간 자동화)

on:
  # 1. 정해진 시간 자동 실행 (UTC 기준 -> 한국 시간 KST = UTC + 9)
  schedule:
    # 매일 한국 시간 오전 약 09:00 (UTC 00:07) - 전 세계 00분 병목 회피
    - cron: '7 0 * * *'
    # 매일 한국 시간 오후 약 18:00 (UTC 09:07) - 전 세계 00분 병목 회피
    - cron: '7 9 * * *'

  # 2. GitHub 웹/모바일에서 'Run workflow' 버튼 클릭 시 즉시 수동 실행 가능
  workflow_dispatch:
    inputs:
      channels:
        description: '발송할 채널 (기본 4개 채널 모두)'
        required: true
        default: 'baseball,celebrity,today_events,animals'
      count:
        description: '채널당 생성할 카드뉴스 개수 (기본 5개씩 총 20개)'
        required: true
        default: '5'

jobs:
  curate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 카드뉴스 자동 생성 및 텔레그램 발송 (아침 20개 / 저녁 20개)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_CHANNELS: ${{ github.event.inputs.channels || 'baseball,celebrity,today_events,animals' }}
          COUNT_PER_CHANNEL: ${{ github.event.inputs.count || '5' }}
        run: |
          python run_telegram_pipeline.py
